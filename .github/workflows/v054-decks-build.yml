name: v054 decks build
on:
  push:
    branches: [v054-app-beta-v02-decks]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build application
        run: npm run build
      - name: Syntax-check JavaScript
        run: find dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify App Beta deck layer
        run: |
          test -f dist/shifters-v054-decks.js
          grep -q 'shifters-v054-decks.js' dist/index.html
          grep -q '0.5.4-app-beta-v02-decks' dist/shifters-v054-decks.js
          grep -q 'Kindled Claws' dist/shifters-v054-decks.js
          grep -q 'Thickened Scales' dist/shifters-v054-decks.js
