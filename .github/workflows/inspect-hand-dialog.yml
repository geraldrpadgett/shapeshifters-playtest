name: Inspect support row source
on:
  push:
    branches: [inspect-hand-dialog-v052]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - name: Print support row source
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['dist/app.js','dist/shifters-v045-patch.js']){
            if(!fs.existsSync(file))continue;
            const s=fs.readFileSync(file,'utf8');
            for(const needle of ['support-row','Guardian','Relic']){
              let i=s.indexOf(needle);
              let shown=0;
              while(i>=0&&shown<8){const piece=s.slice(Math.max(0,i-1000),i+2600);if(piece.includes('support-row')){console.log(`SUPPORT_SOURCE ${file} ${needle}\n${piece}\nSUPPORT_SOURCE_END`);shown++;}i=s.indexOf(needle,i+1);}
            }
          }
          NODE
