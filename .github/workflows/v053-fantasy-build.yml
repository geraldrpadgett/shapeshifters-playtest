name: v053 fantasy build
on:
  push:
    branches: [v053-fantasy-overhaul]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build application
        run: npm run build
      - name: Syntax-check JavaScript
        run: find dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify fantasy assets
        run: |
          test -f dist/shifters-v053-fantasy.css
          test -f dist/shifters-v053-fantasy.js
          grep -q 'shifters-v053-fantasy.css' dist/index.html
          grep -q 'shifters-v053-fantasy.js' dist/index.html
          grep -q '0.5.3-fantasy-tabletop' dist/shifters-v053-fantasy.js
