name: Live production smoke
on:
  push:
    branches: [main]

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build application
        run: npm run build
      - name: Syntax-check built JavaScript
        run: find dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify theme and deck assets
        run: |
          test -f dist/shifters-v054-decks.js
          test -f dist/shifters-v055-prismatic.css
          test -f dist/shifters-v055-prismatic.js
          test -f dist/shifters-v056-dnd.css
          test -f dist/shifters-v056-dnd.js
          test -f dist/shifters-v057-visual-fix.css
          test -f dist/shifters-v057-visual-fix.js
          grep -q 'shifters-v054-decks.js' dist/index.html
          grep -q 'shifters-v056-dnd.css' dist/index.html
          grep -q 'shifters-v056-dnd.js' dist/index.html
          grep -q 'shifters-v057-visual-fix.css' dist/index.html
          grep -q 'shifters-v057-visual-fix.js' dist/index.html
          grep -q '0.5.4-app-beta-v02-decks' dist/shifters-v054-decks.js
          grep -q '0.5.7-visual-layer-fix' dist/shifters-v057-visual-fix.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Test deployed production game
        env:
          PLAYTEST_URL: https://shapeshifters-playtest-wzwi.vercel.app
          EXPECTED_VERSION: 0.5.7-visual-layer-fix
        run: |
          node tests/live-smoke.cjs
          node tests/v052-rules-smoke.cjs
          node tests/v054-decks-smoke.cjs
          node tests/v056-theme-smoke.cjs
      - name: Upload visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v057-layer-fix-screenshot
          path: artifacts/v057-layer-fix.png
          if-no-files-found: ignore
