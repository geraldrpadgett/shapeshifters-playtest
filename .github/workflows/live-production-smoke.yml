name: Live production smoke
on:
  push:
    branches: [main]

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build application
        run: npm run build
      - name: Syntax-check built JavaScript
        run: find dist -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify fantasy theme and deck assets
        run: |
          test -f dist/shifters-v053-fantasy.css
          test -f dist/shifters-v053-fantasy.js
          test -f dist/shifters-v054-decks.js
          grep -q 'shifters-v053-fantasy.css' dist/index.html
          grep -q 'shifters-v053-fantasy.js' dist/index.html
          grep -q 'shifters-v054-decks.js' dist/index.html
          grep -q '0.5.4-app-beta-v02-decks' dist/shifters-v054-decks.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test deployed production game
        env:
          PLAYTEST_URL: https://shapeshifters-playtest-wzwi.vercel.app
          EXPECTED_VERSION: 0.5.4-app-beta-v02-decks
        run: |
          node tests/live-smoke.cjs
          node tests/v052-rules-smoke.cjs
          node tests/v054-decks-smoke.cjs
